<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon admin-accent">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <rect x="2" y="2" width="8" height="8" rx="2" fill="white"/>
          <rect x="12" y="2" width="8" height="8" rx="2" fill="rgba(255,255,255,0.4)"/>
          <rect x="2" y="12" width="8" height="8" rx="2" fill="rgba(255,255,255,0.4)"/>
          <rect x="12" y="12" width="8" height="8" rx="2" fill="white"/>
        </svg>
      </div>
      <div>
        <div class="logo-app">GestStages</div>
        <div class="logo-role">Administrateur</div>
      </div>
    </div>

    <nav class="nav">
      <a routerLink="/admin-dashboard/accueil" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="9" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.4"/><rect x="1" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.4"/></svg>
        Tableau de bord
      </a>

      <a routerLink="/admin-dashboard/utilisateurs" routerLinkActive="nav-active" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M2 14c0-3.3 2.7-5 6-5s6 1.7 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Utilisateurs
      </a>

      <a routerLink="/admin-dashboard/validation" routerLinkActive="nav-active" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M5 8l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Validation
        <span class="nav-badge" *ngIf="pendingNavCount">{{ pendingNavCount }}</span>
      </a>

    
    </nav>

    <div class="sidebar-footer">
      <div class="s-avatar admin-accent">AD</div>
      <div style="flex:1;min-width:0;">
        <div class="s-name">Admin Système</div>
        <div class="s-role">Administrateur</div>
      </div>
      <button type="button" class="btn-logout" (click)="logout()" title="Déconnexion">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 2h3a1 1 0 011 1v10a1 1 0 01-1 1h-3M6 11l-4-3 4-3M2 8h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-date">{{ today }}</div>
        <h1 class="page-title">Espace administrateur</h1>
      </div>
    </div>

    <router-outlet></router-outlet>
  </main>
</div>
