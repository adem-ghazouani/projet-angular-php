<div class="layout">

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon etud-accent">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M11 2L20 7.5v7L11 20l-9-5.5v-7L11 2z" fill="white" opacity="0.9"/>
        </svg>
      </div>
      <div>
        <div class="logo-app">GestStages</div>
        <div class="logo-role">Étudiant</div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-label">MON ESPACE</div>
      <a routerLink="/etudiant-dashboard/accueil" routerLinkActive="nav-active" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="9" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.4"/><rect x="1" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.4"/></svg>
        Tableau de bord
      </a>
      <a routerLink="/etudiant-dashboard/demande" routerLinkActive="nav-active" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Mes demandes de stage
      </a>
      <a routerLink="/etudiant-dashboard/rapport" routerLinkActive="nav-active" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 8h6M5 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Mon rapport
      </a>
      <a routerLink="/etudiant-dashboard/resultats" routerLinkActive="nav-active" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v4l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Mes résultats
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="s-avatar etud-accent">{{ initials }}</div>
      <div style="flex:1;min-width:0;">
        <div class="s-name">{{ currentUser?.prenom }} {{ currentUser?.nom }}</div>
        <div class="s-role">Étudiant</div>
      </div>
      <button class="btn-logout" (click)="logout()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 2h3a1 1 0 011 1v10a1 1 0 01-1 1h-3M6 11l-4-3 4-3M2 8h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <main class="main">

    <div class="page-header">
      <div>
        <div class="page-date">{{ today }}</div>
        <h1 class="page-title">Espace Étudiant</h1>
      </div>
      <div class="header-right">
        <div class="welcome-chip">Bonjour {{ currentUser?.prenom }} 👋</div>
        <span class="status-chip" [attr.data-status]="currentUser?.status">
          Compte : {{ currentUser?.status }}
        </span>
      </div>
    </div>

    <div *ngIf="loading" class="loading-wrap"><div class="spinner"></div></div>

    <ng-container *ngIf="!loading">
      <router-outlet></router-outlet>
    </ng-container>

  </main>
</div>
