<div class="layout">

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon ens-accent">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M11 2L19 7v7l-8 6-8-6V7L11 2z" fill="white" opacity="0.9"/>
          <path d="M7 17v3M15 17v3" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="logo-app">GestStages</div>
        <div class="logo-role">Enseignant</div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-label">MON ESPACE</div>
      <a
        routerLink="/enseignant-dashboard/accueil"
        routerLinkActive="nav-active"
        class="nav-link"
      >
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="9" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.4"/><rect x="1" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.4"/></svg>
        Tableau de bord
      </a>
      
      <a routerLink="/enseignant-dashboard/rapports" routerLinkActive="nav-active" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 8h6M5 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Rapports
      </a>
      <a routerLink="/enseignant-dashboard/demandes" routerLinkActive="nav-active" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1l2 4h4l-3.3 2.4 1.3 4L8 9.2 4.7 11.4 6 7.4 2.7 5H7L8 1z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        Demandes de stage
      </a>
      <a routerLink="/enseignant-dashboard/evaluations" routerLinkActive="nav-active" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="10" width="12" height="4" rx="1" stroke="currentColor" stroke-width="1.4"/><path d="M5 10V7M8 10V4M11 10V7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Évaluations
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="s-avatar ens-accent">EN</div>
      <div style="flex:1;min-width:0;">
        <div class="s-name">Enseignant</div>
        <div class="s-role">Responsable stages</div>
      </div>
      <button class="btn-logout" (click)="logout()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 2h3a1 1 0 011 1v10a1 1 0 01-1 1h-3M6 11l-4-3 4-3M2 8h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <main class="main">

    <div class="page-header">
      <div>
        <div class="page-date">{{ today }}</div>
        <h1 class="page-title">Espace Enseignant</h1>
      </div>
      <div class="welcome-chip">Bonjour 👋</div>
    </div>

    <div *ngIf="loading" class="loading-wrap"><div class="spinner"></div></div>

    <ng-container *ngIf="!loading">
      <router-outlet></router-outlet>
    </ng-container>
  </main>
</div>
